<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel itineraries | Poonam Varkhedi Krish</title>
  <meta name="description" content="Day-by-day travel itineraries with hotels, tours, budgets and packing lists, ready to copy.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500;600&family=Ovo&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body data-root="../" data-section="travel" data-page="travel-index">
  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <p class="kicker">travel</p>
        <h1>Trips worth copying</h1>
        <p class="lede">Every trip I plan ends up as a spreadsheet of days, bookings, costs and packing notes. These are those plans, cleaned up so you can follow them step by step.</p>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="wrap">
        <div class="trip-list" id="trip-list"></div>
      </div>
    </section>
  </main>

  <script src="../assets/js/trips.js"></script>
  <script src="../assets/js/site.js"></script>
  <script>
  (function () {
    var esc = window.SITE.esc;
    var art =
      '<svg viewBox="0 0 320 90" aria-hidden="true">' +
        '<path d="M14 70 C 70 70, 80 22, 130 26 S 200 70, 240 58 S 290 20, 306 16" fill="none" stroke="#4d403a" stroke-width="1" stroke-dasharray="4 5"/>' +
        '<g fill="#fff" stroke="#4d403a" stroke-width="1"><circle cx="14" cy="70" r="5"/><circle cx="130" cy="26" r="5"/><circle cx="240" cy="58" r="5"/><circle cx="306" cy="16" r="5"/></g>' +
      "</svg>";
    var list = document.getElementById("trip-list");
    list.innerHTML = (window.TRIPS || []).map(function (t) {
      return '<a class="trip-card" href="' + t.slug + '.html">' +
        '<div class="art"><span class="script">' + esc(t.title) + '</span><span class="label">' + esc(t.when) + "</span>" + art + "</div>" +
        '<div class="body"><h3>' + esc(t.title) + '</h3><p class="muted">' + esc(t.blurb) + "</p>" +
        "<dl><dt>Length</dt><dd>" + esc(t.length) + "</dd><dt>Route</dt><dd>" + esc(t.route) + "</dd><dt>Group</dt><dd>" + esc(t.group) + "</dd></dl>" +
        '<span class="btn">See the full itinerary</span></div></a>';
    }).join("") +
    '<div class="trip-empty"><h3>More trips on the way</h3><p style="margin:0">I add each trip here after I get home, once the plan has been tested for real.</p></div>';
  })();
  </script>
</body>
</html>
